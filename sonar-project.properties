# SonarQube / SonarLint configuration for NEBULA.
#
# Two jobs, and only two:
#
#   1. Tell the analyser what this repository actually is, so it stops reporting
#      on vendored dependencies and build output that nobody here wrote.
#   2. Record the small number of findings that are the analyser being wrong
#      about this codebase — each one scoped to a rule AND a path, each one with
#      the reason written down.
#
# What this file must never become: a place to make a rule go quiet because a
# finding was inconvenient. There is no entry below that disables a rule
# globally, and none that excludes a whole language, a whole package or a whole
# directory of ours. If an entry cannot name the file it applies to and say why
# in one line, it does not belong here.
#
# Findings that were FIXED rather than suppressed are deliberately absent — the
# absence is the record that they were fixed. In particular there is no entry for
# java:S1598, java:S6213, java:S2479, java:S6218, java:S127, python:S5713,
# python:S5778, php:S1848, php:S112 (in the store), javascript:S2871,
# javascript:S1128, javascript:S7781, javascript:S4624, typescript:S3735 or
# typescript:S6582. Those were all real, and the code changed.
#
# php:S3415 is deliberately NOT in that list. It was reviewed and suppressed
# (r19 below), not fixed — the analyser is wrong about which argument is the
# expected one in this project's conformance suites.

sonar.projectKey=nebula-token
sonar.projectName=NEBULA
sonar.projectVersion=1.0.1-rc.3
sonar.sourceEncoding=UTF-8

# ── What is ours ─────────────────────────────────────────────────────────────
#
# Listed positively rather than by exclusion, so that a directory which is not
# part of this repository cannot be analysed by accident merely because it is
# present in somebody's working tree.
sonar.sources=packages,scripts,docker,spec

# Test code, so that test-only rule profiles apply where they should.
#
# Classified by pattern rather than with sonar.tests, deliberately. Every test
# tree here lives *inside* packages/, so naming those directories in sonar.tests
# while packages/ is a source root would ask the scanner to index the same file
# as both source and test, which it refuses ("can't be indexed twice").
# sonar.test.inclusions partitions the source set instead, so the two can never
# overlap however the ten package layouts evolve.
#
# Three patterns cover all ten: nine ports keep tests in test/ or tests/, and Go
# keeps them beside the sources under the language's _test.go convention.
sonar.test.inclusions=\
  **/test/**,\
  **/tests/**,\
  **/*_test.go

# Dependencies, build output and generated artefacts. Not suppressions: this is
# code this project did not write and does not ship.
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/target/**,\
  **/bin/**,\
  **/obj/**,\
  **/dist/**,\
  **/_build/**,\
  **/deps/**,\
  **/.dart_tool/**,\
  **/*.min.js

# ── Narrowly-scoped rule suppressions ────────────────────────────────────────
#
# Every block is one rule against one path, with the reason on the line above.

sonar.issue.ignore.multicriteria=\
  r1,r2,r3,r4,r5,\
  r6,r7,r29,\
  r8,r9,\
  r10,r11,\
  r14,\
  r15,r16,r20,r22,r23,\
  r17,r18,r24,r25,\
  r19,\
  r21,\
  r26,r27,\
  r28

# --- S3776 on the behaviour-vector runners -----------------------------------
#
# The five runners below are interpreters for the step vocabulary published in
# spec/behavior-vectors.json under `runner.ops`. Each `case` is one entry of that
# published table, in the same order, so a reviewer checks a port against the
# vectors by reading the two side by side. That one-to-one correspondence is the
# only thing that makes a conformance runner auditable, and a dispatch over a
# published op vocabulary is branchy by construction — the branching is the
# specification's, not the runner's.
#
# Extracting one handler per op was considered for each file and rejected for the
# same concrete reason: the ops share a single mutable scenario state (engine,
# store, bindings, issued secrets, presented device ids, clock), "reconfigure"
# reassigns the engine and "advance" reassigns the clock. Extracted handlers
# cannot do either without a context object threaded through all ten, which buys
# an identical total complexity, ten identical parameter lists, and a dispatch
# table that no longer resembles the vector format. The parts that lift cleanly
# already have been lifted in every port: resolveToken, deviceOf, checkSuccess.
#
# Each file also carries this reasoning inline, and Java and C# additionally
# carry a compiler-visible annotation.

# Vector-runner dispatch; splitting it would hide the map to behavior-vectors.json.
sonar.issue.ignore.multicriteria.r1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.r1.resourceKey=packages/typescript/test/behavior-runner.ts

# Vector-runner dispatch; see the javadoc on runScenario for the rejected split.
