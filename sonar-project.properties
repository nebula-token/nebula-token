# --- S3415 "assertion arguments in the wrong order" --------------------------
#
# The rule's heuristic assumes that when one argument is a class constant and the
# other is a dynamic expression, the constant must be the expected value. In this
# project's conformance suites it is the other way round on purpose: the value
# read out of spec/test-vectors.json is the EXPECTED one — it is the normative
# artefact all ten ports are measured against — and the library constant is the
# ACTUAL, because the library is what is under test. Swapping them would invert
# what a failure message means. The Java and Ruby conformance suites assert the
# same fact in the same order, so the ten stay readable against each other.
#
# Scoped to the conformance suite alone; EngineTest and BehaviorVectorsTest are
# not covered, so a genuinely reversed assertion there is still reported.

# Published vector is the expected value, library constant the actual — by design.
sonar.issue.ignore.multicriteria.r19.ruleKey=php:S3415
