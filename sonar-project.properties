# --- S4036 "OS command searched in PATH" -------------------------------------
#
# Both scripts spawn a fixed argument vector through execFileSync/spawnSync — no
# shell, and nothing interpolated into the arguments — so the injection channel
# the rule guards is already closed. What remains is PATH resolution of `git` and
# `docker`, and the caller already trusts PATH completely: these run as
# `node scripts/<name>.mjs` from a developer shell or a CI step, so `node` itself
# was resolved the same way. Pinning git's path while node's stays inherited
# raises no bar.
#
# There is also no portable path to pin: git and docker live in /usr/bin on the
# CI images and under Program Files — or any portable-install directory — on the
# Windows machines this repository is developed on. Hard-coding either, or
# forcing a fixed PATH, would break these as local gates on one of the two
# platforms: a certain cost against a threat that needs an attacker who can
# already write to your PATH. check-links.mjs carries the full reasoning inline.

