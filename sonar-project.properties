# --- S8786 super-linear backtracking, beyond r17/r18 -------------------------
#
# This amends the parting claim of the r17/r18 note above: not every remaining
# pattern in scripts/ is bounded by construction. Two more measure super-linear,
# and they are bounded by their input instead.
#
# docker-test.mjs has one idiom twice — a lazy `(.+?)` between two `\s*` runs,
# which is a trim, in the compose line parser and in the tag splitter beside it.
# Measured rather than assumed: 60 ms on an 8,000-character line, quadrupling as
# the line doubles. Quadratic, not exponential, against one line of this
# repository's own docker/compose.yml, which is under 120 characters. There is no
# small rewrite to take: a linear lazy trim wants an atomic group or a possessive
# quantifier, JavaScript has neither, and the remaining alternative is the
# `(?=(\S+))\1` lookahead-capture hack — an unreadable pattern in a gate script,
# against no threat, which is the trade r17 already declined.
#
# check-links.mjs's `^#{1,6}\s+(.*?)\s*#*\s*$` is the ATX heading matcher, and it
# costs under a millisecond on a 48,000-character line — 400 times the longest
# heading here. It is left alone for what it feeds rather than what it costs: the
# capture becomes a slug, and the slugs are the anchor set every `#fragment` in
# the repository is checked against. Every obvious linear rewrite moves the
# boundary between "the closing hashes of a closed ATX heading" and "a `#` inside
# the heading text", which would change the anchors this gate computes without
# changing what it claims to check.
sonar.issue.ignore.multicriteria.r24.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.r24.resourceKey=scripts/docker-test.mjs

sonar.issue.ignore.multicriteria.r25.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.r25.resourceKey=scripts/check-links.mjs

