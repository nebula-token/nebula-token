# --- S5843 regex too complex, on the discarded-revokeToken matcher -----------
#
# One pattern spelling one call in ten languages: an optional `await`, an
# optional `$var =` or `var =` binding, and a receiver chain written with `.`,
# `->`, `::` or `:`, ahead of revokeToken or revoke_token. The complexity score
# is the count of those spellings; there is nothing accidental in it to remove.
#
# Simplifying costs more than it looks. This is the negative half of the check
# that a sample never calls revokeToken and discards the result — [N-36] makes
# that call authenticated, so the discarding form teaches answering 204 to a
# logout that never happened. Dropping an alternative does not make the gate
# fail; it makes the gate stop reading one language and keep printing OK.
sonar.issue.ignore.multicriteria.r28.ruleKey=javascript:S5843
sonar.issue.ignore.multicriteria.r28.resourceKey=scripts/check-skills.mjs

# --- S3776 on the [N-6] parser -----------------------------------------------
#
# [N-6] specifies parsing as a fixed, ordered list of rejections, and
# parse_token is that list written out: twelve guards, each annotated with the
# sub-clause it enforces, in the order the specification states them. Nothing in
# it nests — every increment is a flat top-level rejection, which is the shape
# that makes the ladder checkable at all.
#
# The same function already has this answer recorded for PHP, where what fires
# is the return counter rather than the complexity counter (r8 above), and where
# Nebula.php carries a NOSONAR marker to match.
#
# 16 against 15, and the two points over PHP's 14 on the identical algorithm are
# a language tax rather than a design difference: base64.urlsafe_b64decode raises
# where PHP's and Ruby's decoders return null, so the decode costs a try/except
# that the other ports fold into an existing `or`.
#
# Two edits would buy the point back — merge the three per-part [N-6.4] checks
# behind one `or`, or lift them into a helper — and both are refused for the
# reason r6/r7 gives: they delete the one-to-one map between a branch and a
# numbered clause, which is what lets a reviewer check this parser against the
# other nine ports and against the p-* cases in spec/test-vectors.json.
#
# Scoped to the file as r6/r7 are; nothing else in it is near the threshold
# (refresh 11, _handle_reuse 12, __init__ 11).
sonar.issue.ignore.multicriteria.r29.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.r29.resourceKey=packages/python/nebula_token/__init__.py

# ── What this list does NOT yet cover, and why that is not an endorsement ─────
#
# r1..r7 name four of the ten behaviour runners and two of the ten engines. That
# is the set somebody has pointed an analyser at, not the set that is branchy.
# Counted by reading — not observed, because no workflow here runs Sonar — the
# following are expected to fire the moment the analyser is aimed at them, all
# for reasons already answered above:
#
#   typescript:S3776  packages/typescript/src/index.ts       parseToken, ~17 — the
#                     [N-6] ladder again, two of its points being the
#                     noUncheckedIndexedAccess narrowing guard no other port needs
#   dart:S3776        packages/dart/lib/src/nebula.dart       parseToken, ~16, same
#   python:S3776      packages/python/tests/behavior_runner.py  run_scenario, ~147
#   dart:S3776        packages/dart/test/behavior_runner.dart   same inline op switch
#   php:S3776         packages/php/tests/BehaviorVectorsTest.php same again
#
# They are named rather than pre-suppressed: an entry for an issue nobody has
# seen is a claim, and this file is a record of decisions taken on evidence. Add
# them when the analyser reports them, with the reading confirmed.
#
# Ruby and Elixir are the honest counter-examples and are expected to stay
# silent: Ruby's runner is already split per op (and carries a rubocop disable
# instead), and Elixir's parser puts the rules in the function head as guards.
#
# ── Findings reviewed and rejected as analyser error ──────────────────────────
#
# Recorded so they are not re-litigated. All of these are reported by the
# SonarQube IDE extension in STANDALONE mode, which neither applies the
# suppressions above nor builds ../../src/NebulaToken/NebulaToken.csproj — so
# types from the referenced project do not resolve, and several rules then
# misjudge the code:
#
#   csharpsquid:S1144  eighteen "unused private method" reports naming the six
#                      store methods. They are IRefreshTokenStore implementations
#                      on three private test doubles (ControllableStore,
#                      ExplodingStore, GatedStore). Deleting one is CS0535, and
#                      deleting the set removes the [N-20] fail-closed test, the
#                      [N-34] concurrency test and the failNextCas op the
#                      conflict-* scenarios need.
#   csharpsquid:S1481  "unused local 'unequal'" in EngineTests.cs. It is consumed
#                      eleven lines later by the foreach that carries every
#                      assertion in the test.
#   csharpsquid:S1125  four "unnecessary Boolean literal" reports. Every one is a
#                      `bool?` compared to a literal, where the literal is the
#                      tri-state semantics; the suggested rewrite does not compile.
#   csharpsquid:S2325  "make AsRotated static". It calls the instance method Copy.
#   csharpsquid:S2166  "rename NebulaConfigException or correct its inheritance".
#                      It derives from ArgumentException, which derives from
#                      Exception.
#   javascript:S5332   "use https" in check-licenses.mjs. The string is the
#                      Apache-2.0 marker this gate matches to detect verbatim
#                      licence text. Changing it either breaks the gate or edits
#                      the licence.
#
# In connected mode, against a server that reads this file, most of the noise
# above disappears on its own.
