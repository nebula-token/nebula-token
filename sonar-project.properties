# --- S8786 super-linear regex backtracking -----------------------------------
#
# The two patterns that genuinely backtrack are the lazy dot-all pairs that pull
# the <profile> block out of packages/java/pom.xml and strip XML comments. Their
# input is this repository's own tracked files, read by a maintenance script that
# already executes the repository's code; no user input, no network input and no
# untrusted string reaches either. The linear rewrite is a negative-lookahead
# chain — /<!--(?:[^-]|-(?!->))*-->/ and worse for the profile matcher — which
# trades a readable pattern in a gate script for an unreadable one, against no
# threat. The other flagged patterns in scripts/ are bounded by construction:
# `\d+(?:\.\d+)*` and friends have a mandatory literal separator between
# repetitions, so they admit no ambiguous split.
#
