name: Bug report
description: An implementation misbehaves, or diverges from the specification
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a security vulnerability, stop.** Do not file an issue —
        report it privately per [SECURITY.md](https://github.com/nebula-token/nebula-token/blob/main/SECURITY.md).

        Never paste a real token, verifier, pepper or raw device identifier
        into an issue. Mint a throwaway one with a throwaway pepper.

  - type: dropdown
    id: language
    attributes:
      label: Implementation
      options:
        - TypeScript
        - Python
        - Go
        - Rust
        - Java
        - PHP
        - C#
        - Dart
        - Ruby
        - Elixir
        - Two or more disagree with each other
        - The specification itself
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version and SPEC_VERSION
      description: The package version, the `SPEC_VERSION` it reports, and the runtime version.
      placeholder: "nebula-token 1.0.1, SPEC_VERSION 1, Python 3.12.4"
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Requirement violated
      description: >-
        The `[N-*]` id you believe is broken, if you know it. This is the single
        most useful line in the report — every requirement in SPECIFICATION.md is
        numbered so that a defect can be named rather than described.
      placeholder: "[N-26] step 5"

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Quote the specification where you can.
      placeholder: "refresh() returns REUSE_DETECTED and revokes the family ([N-30])."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >-
        Ideally shaped like a behaviour vector: the operations in order, the
        clock, and the expected versus actual outcome. If you can write it as a
        case for `spec/behavior-vectors.json`, you have written both the bug
        report and the test for its fix.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: No real token, verifier, pepper or device identifier appears above.
          required: true
        - label: I checked whether another implementation agrees with mine.
