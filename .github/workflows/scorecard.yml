# OpenSSF Scorecard.
#
# NEBULA asks people to put it on an authentication path. Scorecard is the
# standard way for their supply-chain review to answer "is this project run
# carefully?" without reading the repository — so publishing the score is part
# of the argument, and a regression in it is a defect like any other.
#
# The checks this repository is deliberately built to pass:
#   Pinned-Dependencies  every action is a commit SHA (scripts/check-actions-pinned.mjs)
#   Token-Permissions    contents: read at the top of every workflow
#   Dangerous-Workflow   no pull_request_target, no untrusted checkout
#   Packaging            release.yml publishes from CI only
#   CI-Tests / SAST      ci.yml and codeql.yml
#
# TWO checks score zero. Both are accurate, and both are listed so that a low
# number is read as a fact about the project rather than as a regression:
#
#   Fuzzing              not done. SECURITY.md and README.md both state that the
#                        parsers have not been fuzzed beyond the published
#                        vectors, and a comment here claiming otherwise would be
#                        the only place in the repository that disagrees.
#   Signed-Releases      Scorecard inspects RELEASE ASSETS for signature
#                        filenames (.asc, .sig, .intoto.jsonl). `github-release`
#                        attaches .json, .pdf and .zip; npm's provenance lives in
#                        the registry, and attest-build-provenance writes to
#                        GitHub's attestations API — neither is a release asset.
#                        Attaching the attestation bundle would fix it, and is
#                        post-1.0.0 work.

name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Upload the result to the code-scanning dashboard.
      security-events: write
      # Publish the score so the badge and the public API can serve it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing requires the repository to be public. It is what lets
          # api.securityscorecards.dev answer for this project, which is what a
          # downstream reviewer actually queries.
          publish_results: true

      - name: Upload the raw result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
